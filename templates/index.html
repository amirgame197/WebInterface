<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="{{ theme_colors.bg }}">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <title>{{ title_name }}</title>
    <style>
        :root {
            --bg: {{ theme_colors.bg }};
            --bg-soft: {{ theme_colors.bg_soft }};
            --fg: {{ theme_colors.fg }};
            --fg-dim: {{ theme_colors.fg_dim }};
            --fg-faint: {{ theme_colors.fg_faint }};
            --accent: {{ theme_colors.accent }};
            --accent-dim: {{ theme_colors.accent_dim }};
            --danger: {{ theme_colors.danger }};
            --success: {{ theme_colors.success }};
            --warning: {{ theme_colors.warning }};
            --selection: {{ theme_colors.selection }};
        }
    </style>
    <link rel="stylesheet" href="/static/css/index.style.css">
</head>
<body>
    <form id="terminalForm" class="terminal" autocomplete="on" autocorrect="off" spellcheck="false">
        <div class="terminal-output" id="terminalOutput" aria-live="polite" tabindex="-1"></div>

        <div class="terminal-input-line" id="usernameLine">
            <span class="terminal-prompt">login as:</span>
            <input type="text" id="usernameInput" class="terminal-input"
                   name="username"
                   autocomplete="username"
                   autocapitalize="off"
                   autocorrect="off"
                   spellcheck="false">
        </div>

        <div class="terminal-input-line" id="passwordLine">
            <span class="terminal-prompt">Password:</span>
            <input type="password" id="passwordInput" class="terminal-input"
                   name="password"
                   autocomplete="current-password">
        </div>

        <div class="terminal-input-line" id="commandLine">
            <span class="terminal-prompt" id="commandPrompt">$</span>
            <input type="text" id="commandInput" class="terminal-input"
                   autocomplete="off"
                   autocapitalize="off"
                   autocorrect="off"
                   spellcheck="false">
        </div>

        <div class="terminal-input-line" id="confirmLine">
            <span class="terminal-prompt" id="confirmPrompt">[Y/N]</span>
            <input type="text" id="confirmInput" class="terminal-input"
                   autocomplete="off"
                   autocapitalize="off"
                   autocorrect="off"
                   spellcheck="false"
                   maxlength="1">
        </div>

        <button type="submit" aria-hidden="true" tabindex="-1"
                style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; 
                    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;">
        </button>
    </form>
    <script>
        const TITLE_NAME = "{{ title_name }}";
    </script>
    <script src="/static/libs/socket.io.min.js"></script>
    <script src="/static/js/index.app.js"></script>
</body>
</html>
